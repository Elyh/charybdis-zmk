# Explicit overrides: commenting a setting does not override shield defaults.
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_KEYBOARD_NAME="Charybdis USB Test"
CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
# Disable report throttling during isolation so single movements are not dropped.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=0
